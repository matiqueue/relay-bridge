name: Sync dev

# After every push to prod (a merged dev -> prod pull request or a merged release pull request), bring prod back
# into dev, so dev always has the released version and the changelog, and the next dev -> prod pull request starts
# from it.
#
# dev accepts changes only through pull requests (.github/rulesets/pull-requests.json), and on a repository owned
# by a personal account GitHub Actions cannot be a bypass actor of that ruleset. So this workflow does not push to
# dev: it opens (or leaves open) a `prod -> dev` pull request, which a repository admin merges with a merge commit.
# A pull request opened with GITHUB_TOKEN starts no workflow, so the required CI check never reports on it: the
# admin merges it with the ruleset bypass (prod already passed CI on its own push).

on:
  push:
    branches: [prod]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  pull-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Open a prod -> dev pull request when dev is behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin prod dev
          if git merge-base --is-ancestor origin/prod origin/dev; then
            echo "dev already has everything from prod." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existing=$(gh pr list --base dev --head prod --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Pull request #$existing already brings prod into dev." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr create --base dev --head prod \
            --title "🔄 Sync: prod → dev" \
            --body "Brings the released version and changelog from \`prod\` back into \`dev\` (sync-dev.yml). Merge with a merge commit."
          echo "Opened a prod -> dev pull request." >> "$GITHUB_STEP_SUMMARY"
