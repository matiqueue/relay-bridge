name: 🔧 Maintenance
description: Dependencies, configuration, build, tooling, tests, clean-up.
labels:
  - "type: 🔧 chore"
  - "meta: ❓ needs triage"
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: "Tests get the `type: 🧪 test` label automatically."
      options:
        - Dependencies — upgrades, removals, audit fixes
        - Build / CI — pipelines, scripts, configuration
        - Tooling — linters, formatters, local environment
        - Tests — new tests or better coverage
        - Clean-up — dead code, stale files, TODOs
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What needs doing and why now
      placeholder: Upgrade the MCP SDK from 1.32 to 1.33 — it fixes cancellation notifications over stdio.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - mcp
        - providers
        - tasks
        - git
        - policy
        - tooling
        - whole repository
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P1-high
        - P2-medium
        - P3-low
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options:
        - Small
        - Medium
        - Large
    validations:
      required: false

  - type: textarea
    id: relations
    attributes:
      label: Dependencies
      description: "Optional, one per line: `Blocked by: #12`, `Part of: #3`."
    validations:
      required: false
