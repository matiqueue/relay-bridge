name: 🔒 Security hardening
description: Hardening and defence in depth. NOT for exploitable vulnerabilities — use a private advisory for those.
labels:
  - "type: 🔒 security"
  - "meta: ❓ needs triage"
body:
  - type: markdown
    attributes:
      value: |
        **Is this an exploitable vulnerability?** Do not describe it here. Report it through a
        [private security advisory](https://github.com/matiqueue/relay-bridge/security/advisories/new).

  - type: textarea
    id: risk
    attributes:
      label: Risk
      description: What could go wrong, under which preconditions (a malicious task text, a compromised repository, a local attacker…).
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed hardening
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - mcp
        - providers
        - tasks
        - git
        - policy
        - tooling
        - not sure
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P1-high
        - P2-medium
        - P3-low
    validations:
      required: true

  - type: textarea
    id: relations
    attributes:
      label: Dependencies
      description: "Optional, one per line: `Blocked by: #12`, `Part of: #3`."
    validations:
      required: false
