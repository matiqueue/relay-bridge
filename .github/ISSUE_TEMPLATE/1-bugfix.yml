name: 🐛 Bug report
description: Something works incorrectly and needs fixing.
labels:
  - "type: 🐛 bugfix"
  - "meta: ❓ needs triage"
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: The observed behaviour. Paste the tool call and the relevant part of the result (never tokens or private paths).
      placeholder: delegate_task returns "model neon is not available" although `agy models` lists Gemini 4 Neon.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should happen
      placeholder: The task starts on the Neon variant matching the requested effort.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Relay Bridge (`npm run doctor`), Antigravity CLI (`agy --version`), Node.js and macOS.
      placeholder: relay-bridge 0.1.0, agy 1.5.15, Node 24.13, macOS 27.3
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - mcp
        - providers
        - tasks
        - git
        - policy
        - tooling
        - not sure
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0-critical
        - P1-high
        - P2-medium
        - P3-low
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Effort
      description: Small is the same day, medium about 2 days, large about a week.
      options:
        - Small
        - Medium
        - Large
    validations:
      required: false

  - type: textarea
    id: relations
    attributes:
      label: Dependencies
      description: "Optional, one per line. `Blocked by: #12` must be done first, `Part of: #3` is the epic this belongs to."
      placeholder: |
        Blocked by: #12
        Part of: #3
    validations:
      required: false
